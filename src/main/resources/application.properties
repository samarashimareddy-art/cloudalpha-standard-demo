spring.application.name=cloudalpha-standard-demo
server.port=${PORT:8080}

# Stage 9, smoke test, checks /actuator/health; only health and info are exposed.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=cloudalpha-standard-demo
info.app.version=${APP_VERSION:local}

# No stack traces or error details to callers (keeps the DAST stage clean).
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false
