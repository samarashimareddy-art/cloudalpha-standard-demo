# Generated by AI DevOps Platform (Req 4.5): starter allowlist for common
# false positives -- test keys and example/placeholder credentials.
# GitLeaks reads this automatically (no extra flag needed) both via the
# generated pre-commit hook and any server-side pipeline-stage scan of
# this repository.
#
# Extend the [allowlist] section below with anything specific to this
# repository as false positives come up. Keep [extend]/useDefault -- that
# is what keeps GitLeaks' own full, entropy-aware default rule set active
# alongside this allowlist.

[extend]
useDefault = true

[allowlist]
description = "Starter allowlist: common test keys and example/placeholder credentials (Req 4.5)"

# Files/paths that legitimately contain fake credentials for testing.
paths = [
  '''(^|/)testdata/''',
  '''(^|/)fixtures/''',
  '''_test\.go$''',
  '''\.example$''',
  '''\.sample$''',
]

# Any extracted secret containing one of these words is almost always a
# placeholder, not a real credential.
stopwords = [
  "example",
  "placeholder",
  "dummy",
  "changeme",
  "yourkeyhere",
]

# Specific, widely-published placeholder credentials safe to ignore
# outright -- AWS's own official documentation example access key/secret
# key pair, used verbatim across AWS's own docs, never a real credential.
regexes = [
  '''AKIAIOSFODNN7EXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY''',
]
