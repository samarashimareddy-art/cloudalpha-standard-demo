# Stage 8, deploy to Dev. The pipeline replaces IMAGE and creates the
# namespace (app-dev-<build number>), then deletes it after the tests.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudalpha-standard-demo
  labels:
    app: cloudalpha-standard-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudalpha-standard-demo
  template:
    metadata:
      labels:
        app: cloudalpha-standard-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: IMAGE
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: VERSION
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
