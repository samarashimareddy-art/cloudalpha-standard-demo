# Generated by AI DevOps Platform (Req 4.6): scans staged changes for
# hardcoded secrets before they're committed, using GitLeaks.
#
# Setup (one-time, per developer machine):
#   pip install pre-commit
#   pre-commit install
#
# GitLeaks automatically picks up a .gitleaks.toml at this repository's
# root if one exists (e.g. for Req 4.5 allowlist entries) — no extra
# configuration is needed here for that.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
